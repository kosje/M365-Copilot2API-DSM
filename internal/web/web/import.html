<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导入账号 · M365 Copilot2API</title>
<style>
  :root{color-scheme:light dark;--bg:#f5f5f7;--surface:#fff;--line:rgba(0,0,0,.1);--text:#1d1d1f;--muted:#86868b;--accent:#0071e3;--accent-hover:#0077ed;--green:#34c759;--red:#ff3b30;--radius:14px}
  *{box-sizing:border-box}
  @media(prefers-color-scheme:dark){:root{--bg:#0a0a0a;--surface:#1c1c1e;--line:rgba(255,255,255,.14);--text:#f5f5f7;--muted:#98989d}}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);max-width:560px;width:100%;padding:28px 28px 24px;box-shadow:0 16px 48px rgba(0,0,0,.1)}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 20px}
  .drop{border:1.5px dashed var(--line);border-radius:var(--radius);padding:26px 18px;text-align:center;cursor:pointer;transition:border-color .15s ease,background .15s ease}
  .drop:hover{border-color:var(--accent)}
  .drop.drag{border-color:var(--accent);background:rgba(0,113,227,.06)}
  .drop .hint{color:var(--muted);font-size:13px;margin-top:8px}
  input[type=file]{display:none}
  .filename{margin-top:12px;font-size:13px;color:var(--text)}
  button.go{margin-top:18px;width:100%;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s ease,opacity .15s ease}
  button.go:hover{background:var(--accent-hover)}
  button.go:disabled{opacity:.5;cursor:not-allowed}
  .result{margin-top:18px;font-size:14px;line-height:1.6;display:none}
  .result.ok{border-left:3px solid var(--green);padding-left:12px}
  .result.err{border-left:3px solid var(--red);padding-left:12px}
  .result code{background:rgba(127,127,127,.16);padding:1px 6px;border-radius:6px;font-size:12px}
  ul{margin:8px 0 0;padding-left:18px}
  .back{display:inline-block;margin-top:18px;color:var(--accent);text-decoration:none;font-size:13px}
  .fmt{margin-top:16px;color:var(--muted);font-size:12px;line-height:1.6}
</style>
</head>
<body>
  <div class="card">
    <h1>导入账号</h1>
    <p class="sub">上传 <code>accounts.json</code> 或迁移归档（<code>.tar.gz</code>），将账号合并进当前实例。导入前无需停机；冲突账号按 ID / 邮箱更新。</p>

    <label class="drop" id="drop" for="file">
      <div>点击选择文件，或拖拽到此处</div>
      <div class="hint">支持 accounts.json 与 m365-migration-*.tar.gz</div>
      <input type="file" id="file" accept=".json,.tar.gz,.tgz,application/gzip,application/json">
    </label>
    <div class="filename" id="filename"></div>

    <button class="go" id="go" disabled>上传并导入</button>

    <div class="result" id="result"></div>

    <a class="back" href="/">← 返回控制台</a>

    <div class="fmt">账号刷新令牌以加密形式保存（与主密钥绑定）。若目标实例设置了不同的 <code>M365_MASTER_KEY</code>，导入后个别账号可能需在控制台刷新一次令牌。</div>
  </div>

<script>
const fileInput = document.getElementById('file');
const drop = document.getElementById('drop');
const filename = document.getElementById('filename');
const go = document.getElementById('go');
const result = document.getElementById('result');
let selected = null;

fileInput.addEventListener('change', () => { selected = fileInput.files[0] || null; update(); });
['dragenter','dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('drag'); }));
['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('drag'); }));
drop.addEventListener('drop', ev => {
  const f = ev.dataTransfer.files[0];
  if (f) { selected = f; fileInput.files = ev.dataTransfer.files; update(); }
});

function update(){
  filename.textContent = selected ? ('已选择：' + selected.name + '（' + (selected.size/1024).toFixed(1) + ' KB）') : '';
  go.disabled = !selected;
  result.style.display = 'none';
}

go.addEventListener('click', async () => {
  if (!selected) return;
  go.disabled = true;
  result.style.display = 'none';
  const fd = new FormData();
  fd.append('file', selected);
  try {
    const resp = await fetch('/api/admin/accounts/import', { method: 'POST', body: fd, credentials: 'same-origin' });
    if (resp.status === 401) { location.href = '/login'; return; }
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) {
      const msg = data.error && data.error.message ? data.error.message : (data.msg || ('HTTP ' + resp.status));
      show('err', '导入失败：' + msg);
      return;
    }
    let html = '导入完成 — 收到 <b>' + data.received + '</b> 个，新增 <b>' + data.imported + '</b> 个，更新 <b>' + data.updated + '</b> 个。';
    if (data.errors && data.errors.length) {
      html += '<ul>' + data.errors.map(e => '<li>' + escapeHtml(e) + '</li>').join('') + '</ul>';
    }
    show('ok', html);
  } catch (e) {
    show('err', '请求出错：' + e.message);
  } finally {
    go.disabled = false;
  }
});

function show(kind, html){
  result.className = 'result ' + kind;
  result.innerHTML = html;
  result.style.display = 'block';
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
