<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>M365 对话</title>
<style>
:root{
  --bg:#ffffff;--side:#f9fbff;--border:#e6e9f0;--text:#26282d;--muted:#8a8f99;
  --accent:#4d6bfe;--accent-weak:#eef2ff;--user-bubble:#f3f4f7;--ok:#16a34a;--err:#dc2626;
  --radius:16px;
  --tk-k:#7c3aed;--tk-s:#0a7d33;--tk-n:#b45309;--tk-c:#8a8f99;
  --code-bg:#f6f8fc;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1f2126;--side:#17181c;--border:#2c2e34;--text:#e8eaee;--muted:#8b909b;
  --accent:#6b85ff;--accent-weak:#252a3d;--user-bubble:#2a2d33;
  --tk-k:#b39bff;--tk-s:#6fd389;--tk-n:#f0b06a;--tk-c:#7d8290;
  --code-bg:#191b20;
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
.hidden{display:none!important}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(127,127,127,.25);border-radius:3px}

/* ===== login ===== */
#login{display:flex;align-items:center;justify-content:center;height:100%;background:var(--side)}
.login-card{background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:40px 36px;width:min(92vw,380px);box-shadow:0 8px 40px rgba(0,0,0,.06)}
.logo-mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#4d6bfe,#9b7bff);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;margin:0 auto 14px}
.login-card h1{font-size:20px;text-align:center;margin-bottom:2px}
.login-card .sub{color:var(--muted);font-size:12px;text-align:center;margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:12px;background:var(--side);outline:none;transition:.15s}
.field input:focus{border-color:var(--accent)}
.btn-primary{width:100%;padding:11px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600}
.btn-primary:disabled{opacity:.6;cursor:default}
#loginErr{color:var(--err);font-size:12px;text-align:center;min-height:16px;margin-top:10px}

/* ===== layout ===== */
#app{display:flex;height:100%}
.side{width:260px;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.brand{padding:18px 18px 10px;display:flex;align-items:center;gap:10px}
.brand .logo-mark{width:32px;height:32px;font-size:14px;border-radius:9px;margin:0}
.brand b{font-size:15px}
.side-acts{display:flex;gap:8px;margin:10px 14px 0}
.newchat{flex:1;padding:11px 14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 2px 10px rgba(77,107,254,.25)}
.newchat:hover{filter:brightness(1.06)}
.expbtn{padding:0 12px;border:1px solid var(--border);border-radius:12px;color:var(--muted);font-size:16px;background:var(--bg)}
.expbtn:hover{color:var(--accent);border-color:var(--accent)}
.conv-search{margin:10px 14px 0;padding:8px 11px;border:1px solid var(--border);border-radius:10px;background:var(--bg);outline:none;font-size:12.5px;width:calc(100% - 28px)}
.conv-search:focus{border-color:var(--accent)}
.conv-scroll{flex:1;overflow-y:auto;padding:6px 10px}
.conv-group{font-size:11px;color:var(--muted);padding:12px 8px 5px}
.conv-item{padding:9px 11px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px}
.conv-item:hover{background:rgba(127,127,127,.09)}
.conv-item.active{background:var(--accent-weak);color:var(--accent);font-weight:600}
.conv-item .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv-item .act{opacity:0;color:var(--muted);font-size:13px;padding:0 3px;border-radius:6px;flex-shrink:0}
.conv-item:hover .act{opacity:.85}
.conv-item .act:hover{color:var(--accent)}
.conv-item .del:hover{color:var(--err)}
.conv-empty{color:var(--muted);font-size:12px;text-align:center;padding:22px 8px}
.side-foot{border-top:1px solid var(--border);padding:12px 14px 26px}
.foot-user{display:flex;align-items:center;gap:9px}
.foot-user .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#4d6bfe,#9b7bff);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.foot-user .u{flex:1;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot-user .out{color:var(--muted);font-size:12px}
.foot-user .out:hover{color:var(--err)}
.quota-line{margin-top:9px;font-size:11px;color:var(--muted);background:var(--accent-weak);border-radius:9px;padding:6px 9px;line-height:1.6}
.quota-line b{color:var(--accent)}

.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.mob-bar{display:none;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);background:var(--side)}
.mob-bar button{font-size:18px;padding:2px 6px}

/* ===== messages (DeepSeek style) ===== */
.msgs{flex:1;overflow-y:auto;padding:26px 0 14px}
.msg-wrap{max-width:780px;margin:0 auto;padding:0 20px}
.msg.user{display:flex;justify-content:flex-end;margin-bottom:22px}
.msg.user .bubble{background:var(--user-bubble);border-radius:16px;padding:11px 16px;max-width:80%;line-height:1.7;word-break:break-word;white-space:pre-wrap}
.msg.assistant{display:flex;gap:11px;margin-bottom:26px}
.msg.assistant .avatar{width:30px;height:30px;border-radius:9px;flex-shrink:0;background:linear-gradient(135deg,#4d6bfe,#9b7bff);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.msg.assistant .body{flex:1;min-width:0;line-height:1.75}

/* ===== markdown ===== */
.md p{margin:6px 0}
.md h2,.md h3,.md h4{margin:14px 0 6px;line-height:1.4}
.md h2{font-size:18px}.md h3{font-size:16px}.md h4{font-size:14.5px}
.md h2:first-child,.md h3:first-child,.md h4:first-child{margin-top:2px}
.md ul,.md ol{margin:6px 0;padding-left:22px}
.md li{margin:3px 0}
.md blockquote{border-left:3px solid var(--accent);background:var(--accent-weak);border-radius:0 10px 10px 0;padding:8px 13px;margin:8px 0;color:var(--muted)}
.md hr{border:none;border-top:1px solid var(--border);margin:12px 0}
.md a{color:var(--accent);text-decoration:underline;word-break:break-all}
.md code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:rgba(127,127,127,.13);border-radius:4px;padding:1px 5px;word-break:break-all}
.tbl{overflow-x:auto;margin:8px 0}
.md table{border-collapse:collapse;font-size:13px;min-width:50%}
.md th,.md td{border:1px solid var(--border);padding:6px 11px;text-align:left}
.md th{background:var(--side);font-weight:600;white-space:nowrap}
.codeblock{border:1px solid var(--border);border-radius:11px;margin:9px 0;overflow:hidden;background:var(--code-bg)}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:5px 6px 5px 13px;background:var(--side);border-bottom:1px solid var(--border);font-size:11.5px;color:var(--muted);font-family:ui-monospace,Consolas,monospace}
.code-copy{color:var(--muted);font-size:12px;padding:3px 9px;border-radius:7px}
.code-copy:hover{color:var(--accent);background:var(--accent-weak)}
.md pre{margin:0;border:none;border-radius:0;padding:12px 14px;overflow-x:auto;background:var(--code-bg)}
.md pre code{background:none;padding:0;font-size:12.5px;line-height:1.6;word-break:normal;white-space:pre}
.tk-k{color:var(--tk-k);font-weight:600}
.tk-s{color:var(--tk-s)}
.tk-n{color:var(--tk-n)}
.tk-c{color:var(--tk-c);font-style:italic}

/* ===== message tools / meta ===== */
.msg .tools{margin-top:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.msg .tools button{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:4px}
.msg .tools button:hover{color:var(--accent)}
.msg .tools button.danger:hover{color:var(--err)}
.meta{color:var(--muted);font-size:11px;display:flex;gap:8px;align-items:center}
.meta .mbadge{border:1px solid var(--border);border-radius:6px;padding:1px 7px;background:var(--side)}
.msg .bubble img.att{max-width:240px;max-height:240px;border-radius:12px;display:block;margin-top:8px;cursor:zoom-in}
.msg.user .bubble img.att{margin-top:8px}
.typing{display:inline-flex;gap:4px;padding:6px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.stream-cursor::after{content:'▍';color:var(--accent);animation:blink 1s infinite}

/* ===== welcome ===== */
.welcome{padding-top:9vh;text-align:center}
.welcome h1{font-size:30px;background:linear-gradient(90deg,#4d6bfe,#9b7bff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px}
.welcome p{color:var(--muted);font-size:13px}
.welcome .tips{margin-top:30px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:0 20px}
.welcome .tip{border:1px solid var(--border);border-radius:14px;padding:13px 16px;font-size:13px;cursor:pointer;min-width:150px;text-align:left;transition:.15s}
.welcome .tip:hover{border-color:var(--accent);color:var(--accent)}
.welcome .tip small{display:block;color:var(--muted);margin-top:3px}

/* ===== composer ===== */
.composer-wrap{padding:0 0 18px;position:relative}
.composer{max-width:780px;margin:0 auto;padding:0 20px}
.syspanel{border:1px solid var(--border);border-radius:14px;background:var(--side);padding:11px 13px;margin-bottom:8px}
.syspanel label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.syspanel textarea{width:100%;min-height:56px;max-height:140px;border:1px solid var(--border);border-radius:10px;background:var(--bg);padding:8px 11px;outline:none;resize:vertical;font-size:13px;line-height:1.6}
.syspanel textarea:focus{border-color:var(--accent)}
.input-box{border:1px solid var(--border);border-radius:20px;background:var(--side);padding:12px 14px 10px;transition:.15s}
.input-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(77,107,254,.1)}
.input-box.editing{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.15)}
.attach-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.attach-row:empty{display:none}
.attach-row .thumb{position:relative}
.attach-row img{width:52px;height:52px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
.attach-row .rm{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--err);color:#fff;font-size:11px;line-height:18px;text-align:center}
#input{width:100%;border:none;background:none;outline:none;resize:none;max-height:150px;line-height:1.6;font-size:14px}
.input-foot{display:flex;align-items:center;gap:8px;margin-top:8px}
.mode-btn{padding:6px 11px;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:5px;background:var(--bg)}
.mode-btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
.mode-btn.pic{padding:6px 9px}
#modelSel{max-width:180px;padding:6px 8px;border:1px solid var(--border);border-radius:999px;background:var(--bg);color:var(--muted);font-size:12.5px;outline:none}
#modelSel:focus{border-color:var(--accent)}
.send{margin-left:auto;width:34px;height:34px;border-radius:11px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
.send.stop{background:var(--err)}
.send:disabled{opacity:.45;cursor:default}
.edit-hint{font-size:11.5px;color:#f59e0b;margin-top:6px;display:none}
.hint{font-size:11px;color:var(--muted);margin-top:8px;text-align:center}
#jumpBtn{position:absolute;right:26px;bottom:130px;width:36px;height:36px;border-radius:50%;background:var(--bg);border:1px solid var(--border);box-shadow:0 3px 12px rgba(0,0,0,.12);color:var(--muted);font-size:15px;z-index:20}
#jumpBtn:hover{color:var(--accent);border-color:var(--accent)}

#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
#toast.show{opacity:.95}
#verFoot{position:fixed;left:10px;bottom:5px;font-size:11px;color:var(--muted);background:rgba(127,127,127,.13);padding:2px 8px;border-radius:8px;z-index:55;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#verFoot a{color:var(--ok);text-decoration:underline;cursor:pointer}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:60;cursor:zoom-out}
#lightbox img{max-width:94vw;max-height:94vh;border-radius:10px}
@media(max-width:720px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:.25s;box-shadow:0 0 30px rgba(0,0,0,.3)}
  .side.open{transform:none}
  .mob-bar{display:flex}
  #jumpBtn{bottom:150px;right:18px}
}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="logo-mark">M</div>
    <h1>M365 对话</h1>
    <div class="sub">轻量对话测试端 · 网关直连</div>
    <div class="field"><label>用户名</label><input id="liUser" autocomplete="username"></div>
    <div class="field"><label>密码</label><input id="liPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn-primary" id="liBtn" onclick="doLogin()">登 录</button>
    <div id="loginErr"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="side" id="side">
    <div class="brand"><div class="logo-mark">M</div><b>M365 对话</b></div>
    <div class="side-acts">
      <button class="newchat" onclick="newChat()">✏️ 新对话</button>
      <button class="expbtn" onclick="exportConv()" title="导出当前对话为 Markdown">⬇</button>
    </div>
    <input class="conv-search" id="convSearch" placeholder="🔍 搜索对话标题…" oninput="renderConvList()">
    <div class="conv-scroll" id="convList"></div>
    <div class="side-foot">
      <div class="foot-user">
        <div class="avatar" id="uAvatar">·</div>
        <span class="u" id="whoami">—</span>
        <button class="out" onclick="logout()">退出</button>
      </div>
      <div class="quota-line" id="quotaLine">今日额度加载中…</div>
    </div>
  </div>
  <div class="main">
    <div class="mob-bar"><button onclick="document.getElementById('side').classList.toggle('open')">☰</button><b id="mobTitle">M365 对话</b></div>
    <div class="msgs" id="msgs"><div class="msg-wrap" id="msgWrap"></div></div>
    <button id="jumpBtn" class="hidden" onclick="jumpBottom()" title="回到底部">↓</button>
    <div class="composer-wrap">
      <div class="composer">
        <div class="syspanel hidden" id="sysPanel">
          <label><b>🧭 系统提示词（对本页所有对话生效）</b><button class="code-copy" onclick="toggleSys(false)">收起</button></label>
          <textarea id="sysInput" placeholder="例如：你是一名严谨的中文技术顾问，回答先给结论再展开…" oninput="localStorage.setItem('m365_chat_sys',this.value)"></textarea>
        </div>
        <div class="input-box" id="inputBox">
          <div class="attach-row" id="attachRow"></div>
          <textarea id="input" rows="1" placeholder="给 M365 发送消息（Enter 发送 / Shift+Enter 换行）"></textarea>
          <div class="input-foot">
            <button class="mode-btn" id="imgModeBtn" onclick="toggleImgMode()" title="画图模式：发送的描述将生成图片">🎨 画图</button>
            <button class="mode-btn pic" onclick="pickImage()" title="添加图片">🖼️</button>
            <button class="mode-btn" onclick="toggleSys()" title="设置系统提示词">🧭 人设</button>
            <select id="modelSel" title="选择模型" onchange="onModelChange()"></select>
            <button class="send" id="sendBtn" onclick="send()" title="发送（生成中点击可停止）">↑</button>
          </div>
          <div class="edit-hint" id="editHint">✏️ 正在编辑最后一条消息，发送后将覆盖原对话（Esc 取消）</div>
        </div>
        <div class="hint" id="quotaHint"></div>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="verFoot"></div>
<div id="lightbox" class="hidden" onclick="this.classList.add('hidden')"><img id="lightboxImg"></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
let me=null,quota=null,convs=[],curConv=null,curMsgs=[],imgMode=false,attachments=[],busy=false;
let abortCtl=null,editing=false,curModel=localStorage.getItem('m365_chat_model')||'auto';

function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200);}
async function api(path,opt){const r=await fetch(path,opt);if(r.status===401){showLogin();throw new Error('未登录');}const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error&&(d.error.message||d.error)||'请求失败');return d;}

/* ---------- version / update check (GitHub releases, browser-side) ---------- */
function cmpVer(a,b){
  const p=s=>String(s).split(/[.\-+]/).map(x=>parseInt(x,10)||0);
  const pa=p(a),pb=p(b);
  for(let i=0;i<Math.max(pa.length,pb.length);i++){
    const d=(pa[i]||0)-(pb[i]||0);
    if(d)return d>0?1:-1;
  }
  return 0;
}
async function checkUpdate(){
  const el=document.getElementById('verFoot');
  if(!el)return;
  let cur='';
  try{const v=await fetch('/api/version').then(r=>r.json());cur=String(v.version||'').replace(/^v/,'');}catch(e){}
  el.textContent='';
  if(cur&&cur!=='dev'){
    const vt=document.createElement('span');vt.textContent='v'+cur;el.appendChild(vt);
    el.appendChild(document.createTextNode(' · '));
  }
  const gh=document.createElement('a');
  gh.href='https://github.com/my788525/M365-Copilot2API-FNOS';
  gh.target='_blank';gh.rel='noopener';
  gh.textContent='GitHub';
  gh.title='在 GitHub 查看项目仓库';
  el.appendChild(gh);
  if(!cur||cur==='dev')return;
  try{
    const rel=await fetch('https://api.github.com/repos/my788525/M365-Copilot2API-FNOS/releases/latest',{headers:{'Accept':'application/vnd.github+json'}}).then(r=>r.json());
    const latest=String(rel.tag_name||'').replace(/^v/,'');
    if(latest&&cmpVer(latest,cur)>0){
      el.textContent='';
      const a=document.createElement('a');
      a.href=(rel.html_url)||('https://github.com/my788525/M365-Copilot2API-FNOS/releases/tag/v'+latest);
      a.target='_blank';a.rel='noopener';
      a.textContent='v'+cur+' → v'+latest+' 可更新';
      a.title='打开 GitHub Release 下载最新 fpk';
      el.appendChild(a);
    }
  }catch(e){/* GitHub 不可达：仅显示当前版本 + GitHub 链接 */}
}

/* ---------- auth ---------- */
async function boot(){
  checkUpdate();
  try{const d=await api('/api/chatui/session');if(d.authenticated){me=d.username;quota=d.quota;showApp();return;}}catch(e){}
  showLogin();
}
function showLogin(){$('login').classList.remove('hidden');$('app').classList.add('hidden');}
function showApp(){
  $('login').classList.add('hidden');$('app').classList.remove('hidden');
  $('whoami').textContent=me;$('uAvatar').textContent=(me||'?').slice(0,1).toUpperCase();
  $('sysInput').value=localStorage.getItem('m365_chat_sys')||'';
  renderQuota();loadModels();loadConvs();newChat(true);
}
async function doLogin(){
  $('liBtn').disabled=true;$('loginErr').textContent='';
  try{
    const r=await fetch('/api/chatui/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('liUser').value.trim(),password:$('liPass').value})});
    const d=await r.json();
    if(!r.ok){$('loginErr').textContent=(d.error&&d.error.message)||'登录失败';return;}

function groupOf(ts){
  const d=new Date(ts),now=new Date();
  const day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
  const diff=(day(now)-day(d))/86400000;
  if(diff<1)return '今天';
  if(diff<2)return '昨天';
  if(diff<7)return '7 天内';
  if(diff<30)return '30 天内';
  return '更早';
}

/* ---------- markdown rendering ---------- */
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function inline(s){
  let h=esc(s);
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/\*\*\*([^*]+)\*\*\*/g,'<b><i>$1</i></b>');
  h=h.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  h=h.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g,'$1<i>$2</i>');
  h=h.replace(/~~([^~]+)~~/g,'<s>$1</s>');
  h=h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  h=h.replace(/(^|[\s>])(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return h;
}
const KW_RAW={
  js:'const let var function return if else for while do class extends new this typeof instanceof async await try catch finally throw switch case break continue default import export from null undefined true false void yield delete in of static get set super',
  python:'def return if elif else for while class import from as try except finally with lambda None True False and or not in is pass raise yield async await global nonlocal assert del break continue match case',
  go:'func var const type struct interface return if else for range go defer chan map package import switch case break continue fallthrough nil true false select goto',
  bash:'if then else elif fi for do done while until case esac function return in echo export local read set unset shift trap source',
  sql:'SELECT FROM WHERE INSERT INTO VALUES UPDATE SET DELETE JOIN LEFT RIGHT INNER OUTER ON GROUP BY ORDER HAVING LIMIT OFFSET AS AND OR NOT NULL CREATE TABLE DROP ALTER INDEX VIEW DISTINCT COUNT SUM AVG MIN MAX CASE WHEN THEN END',
  java:'public private protected class interface extends implements static final void int long double float boolean char String new return if else for while do try catch finally throw throws switch case break continue default import package this super null true false',
  c:'int char float double void long short unsigned signed struct union enum typedef static const return if else for while do switch case break continue default sizeof goto extern volatile register',
};
const KWSET={};
for(const k in KW_RAW)KWSET[k]=new Set(KW_RAW[k].split(' '));
const LANG_ALIAS={ts:'js',tsx:'js',jsx:'js',javascript:'js',typescript:'js',py:'python',golang:'go',sh:'bash',shell:'bash',zsh:'bash',console:'bash',yml:'bash',yaml:'bash',toml:'bash',ini:'bash',mysql:'sql',postgres:'sql',postgresql:'sql',sqlite:'sql',html:'js',xml:'js',json:'js',cpp:'c','c++':'c',csharp:'java',cs:'java',kt:'java',kotlin:'java',rs:'c',rust:'c'};
function hl(code,lang){
  const key=LANG_ALIAS[lang]||lang;
  const kws=KWSET[key];
  const re=/(\/\*[\s\S]*?\*\/|\/\/[^\n]*|#[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)/g;
  let out='',last=0,m;
  while((m=re.exec(code))){
    out+=esc(code.slice(last,m.index));
    if(m[1])out+='<span class="tk-c">'+esc(m[1])+'</span>';
    else if(m[2])out+='<span class="tk-s">'+esc(m[2])+'</span>';
    else if(m[3])out+='<span class="tk-n">'+esc(m[3])+'</span>';
    else{
      const w=m[4];
      out+=(kws&&kws.has(w))?'<span class="tk-k">'+esc(w)+'</span>':esc(w);
    }
    last=re.lastIndex;
  }
  out+=esc(code.slice(last));
  return out;
}
function codeBlockHtml(b){
  const lang=(b.lang||'').toLowerCase();
  return '<div class="codeblock"><div class="code-head"><span>'+esc(b.lang||'text')+'</span><button class="code-copy">⧉ 复制</button></div><pre><code>'+hl(b.code,lang)+'</code></pre></div>';
}
function parseList(lines,start,indent){
  const first=lines[start].match(/^(\s*)([-*+]|\d+\.)\s+(.*)/);
  const ordered=/\d+\./.test(first[2]);
  let html=ordered?'<ol>':'<ul>';
  let i=start;
  while(i<lines.length){
    const m=lines[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)/);
    if(!m)break;
    const ind=m[1].length;
    if(ind<indent)break;
    if(ind>indent){
      const res=parseList(lines,i,ind);
      html=html.replace(/<\/li>$/,res.html+'</li>');
      i=res.i;continue;
    }
    const parts=[m[3]];i++;
    while(i<lines.length&&lines[i].trim()&&!/^\s*([-*+]|\d+\.)\s+/.test(lines[i])&&!/^\s*```/.test(lines[i])){parts.push(lines[i].trim());i++;}
    html+='<li>'+inline(parts.join(' '))+'</li>';
  }
  return {html:html+(ordered?'</ol>':'</ul>'),i};
}
function mdRender(src){
  if(!src)return '';
  const codeBlocks=[];
  src=String(src).replace(/```(\w*)[ \t]*\n?([\s\S]*?)(?:```|$)/g,(m,lang,code)=>{
    codeBlocks.push({lang:lang||'',code:code.replace(/\n$/,'')});
    return '\u0001'+(codeBlocks.length-1)+'\u0001';
  });
  const lines=src.split('\n');
  let html='',para=[];
  const closePara=()=>{if(para.length){html+='<p>'+para.map(inline).join('<br>')+'</p>';para=[];}};
  let i=0;
  while(i<lines.length){
    const line=lines[i];
    const ph=line.trim().match(/^\u0001(\d+)\u0001$/);
    if(ph){closePara();html+=codeBlockHtml(codeBlocks[+ph[1]]);i++;continue;}
    const h=line.match(/^(#{1,4})\s+(.*)/);
    if(h){closePara();const lv=Math.min(h[1].length+1,4);html+='<h'+lv+'>'+inline(h[2])+'</h'+lv+'>';i++;continue;}
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)){closePara();html+='<hr>';i++;continue;}
    if(/^\s*>\s?/.test(line)){
      closePara();const q=[];
      while(i<lines.length&&/^\s*>\s?/.test(lines[i])){q.push(lines[i].replace(/^\s*>\s?/,''));i++;}
      html+='<blockquote>'+q.map(inline).join('<br>')+'</blockquote>';continue;
    }
    if(/^\s*\|.*\|\s*$/.test(line)&&i+1<lines.length&&/^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])&&lines[i+1].includes('-')){
      closePara();
      const parseRow=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head=parseRow(line);i+=2;
      const rows=[];
      while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){rows.push(parseRow(lines[i]));i++;}
      html+='<div class="tbl"><table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'
        +rows.map(r=>'<tr>'+head.map((_,ci)=>'<td>'+inline(r[ci]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
      continue;
    }
    const lm=line.match(/^(\s*)([-*+]|\d+\.)\s+(.*)/);
    if(lm){closePara();const res=parseList(lines,i,lm[1].length);html+=res.html;i=res.i;continue;}
    if(!line.trim()){closePara();i++;continue;}
    para.push(line);i++;
  }
  closePara();
  return html;
}

function readFileAsDataURL(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>res(fr.result);
    fr.onerror=()=>rej(new Error('read failed'));
    fr.readAsDataURL(file);
  });
}
function compressImage(file){
  return new Promise((res,rej)=>{
    // Very large files: skip canvas (avoids OOM) and forward raw bytes as a data URL.
    if(file.size>12*1024*1024){
      readFileAsDataURL(file).then(res).catch(rej);
      return;
    }
    const url=URL.createObjectURL(file);
    const img=new Image();
    let settled=false;
    const fallback=()=>{ if(settled)return; settled=true; URL.revokeObjectURL(url); readFileAsDataURL(file).then(res).catch(rej); };
    const timer=setTimeout(fallback,8000); // safety net if onload/onerror never fire
    img.onload=()=>{
      if(settled)return; settled=true; clearTimeout(timer);
      try{
        const MAX=1568;let{width:w,height:h}=img;
        if(w>MAX||h>MAX){const k=MAX/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        res(cv.toDataURL('image/jpeg',.85));
      }catch(e){ URL.revokeObjectURL(url); readFileAsDataURL(file).then(res).catch(rej); }
    };
    img.onerror=fallback;
    img.src=url;
  });
}

  renderMsg({role:'user',content:text||'（图片）',images:[]},false);
  if(hasImgs){
    const b=$('msgWrap').querySelector('.msg.user:last-child .bubble');
    for(const p of parts)if(p.type==='image_url'){const img=document.createElement('img');img.className='att';img.src=p.image_url.url;b.appendChild(img);}
  }
  refreshActions();
  jumpBottom(true);
  await streamChat({userMsg:{role:'user',content:parts.length===1&&text?text:parts}});
}
function setEditingUI(){
  $('inputBox').classList.toggle('editing',editing);
  $('editHint').style.display=editing?'block':'none';
}
function editLastUser(){
  if(busy)return;
  for(let i=curMsgs.length-1;i>=0;i--){
    if(curMsgs[i].role==='user'){
      if(i!==curMsgs.length-1){toast('只能编辑最后一条消息');return;}
      $('input').value=curMsgs[i].content||'';
      editing=true;setEditingUI();autoGrow();$('input').focus();
      return;
    }
  }
}
function cancelEdit(){if(editing){editing=false;setEditingUI();$('input').value='';autoGrow();}}
function quoteText(txt){
  const q='> '+String(txt).split('\n').join('\n> ')+'\n\n';
  $('input').value=q+$('input').value;
  autoGrow();$('input').focus();
}
function autoGrow(){const el=$('input');el.style.height='auto';el.style.height=Math.min(el.scrollHeight,150)+'px';}
$('input').addEventListener('input',autoGrow);
$('input').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(busy)stopGen();
    else if(editing)cancelEdit();
  }
});
$('input').addEventListener('paste',e=>{
  const items=e.clipboardData&&e.clipboardData.items;
  if(!items)return;
  const files=[];
  for(const it of items){
    if(it.kind==='file'&&it.type.startsWith('image/')){
      const f=it.getAsFile();if(f)files.push(f);
    }
  }
  if(files.length){e.preventDefault();addFiles(files);}
});

async function streamChat(opts){
  opts=opts||{};
  busy=true;setBusyUI(true);refreshActions();
  const body=renderMsg({role:'assistant',content:''},true);
  jumpBottom(true);
  let acc='';
  const t0=Date.now();
  const paint=()=>{
    body.innerHTML=mdRender(acc);
    if(!acc)body.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';
    else{ // blinking cursor while streaming
      const last=body.lastElementChild;
      if(last&&last.tagName==='P')last.classList.add('stream-cursor');
    }
    scrollBottom();
  };
  try{
    const hist=[];
    for(const m of curMsgs.slice(-40)){
      if(m.role==='assistant'&&m.content)hist.push({role:'assistant',content:m.content});
      else if(m.role==='user'&&m.content)hist.push({role:'user',content:m.content});
    }
    const sp=sysPrompt();
    if(sp)hist.unshift({role:'system',content:sp});
    const payload={
      conversationId:curConv,model:curModel,stream:true,
      messages:hist.concat(opts.userMsg?[opts.userMsg]:[]),
      regenerate:!!opts.regenerate,truncateUser:!!opts.truncateUser,
    };
    abortCtl=new AbortController();
    const r=await fetch('/api/chatui/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:abortCtl.signal});
    if(!r.ok){
      const d=await r.json().catch(()=>({}));throw new Error((d.error&&(d.error.message||d.error))||('HTTP '+r.status));
    }
    const reader=r.body.getReader();const dec=new TextDecoder();let buf='';
    while(true){
      const{done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const line of lines){
        const t=line.trim();if(!t.startsWith('data:'))continue;
        const p=t.slice(5).trim();if(!p||p==='[DONE]')continue;
        try{const j=JSON.parse(p);
          if(j.error)throw new Error(j.error.message||JSON.stringify(j.error));
          const d=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;
          if(d){acc+=d;paint();}
        }catch(e){if(e instanceof SyntaxError)continue;throw e;}
      }
    }
    if(!acc){acc='（空回复，请重试）';paint();}
    // client-side conversation state
    if(opts.userMsg)curMsgs.push(opts.userMsg);
    curMsgs.push({role:'assistant',content:acc,model:curModel,time:new Date().toISOString()});
    renderFinalTools(body,acc,((Date.now()-t0)/1000).toFixed(1));
  }catch(e){
    const aborted=e&&(e.name==='AbortError'||/abort/i.test(e.message||''));
    if(opts.userMsg)curMsgs.push(opts.userMsg);
    if(acc)curMsgs.push({role:'assistant',content:acc,model:curModel,time:new Date().toISOString()});
    body.innerHTML=mdRender(acc)+(acc?'':'')+(aborted
      ?'<div class="tools"><span class="meta">⏹ 已停止生成</span></div>'
      :'<span style="color:var(--err)">⚠ '+esc(e.message||e)+'</span><div class="tools"><button onclick="retryLast()">🔄 重试</button></div>');
  }finally{
    busy=false;abortCtl=null;setBusyUI(false);refreshActions();
    refreshQuota();loadConvs();scrollBottom();
  }
}
function renderFinalTools(body,acc,secs){
  const tools=body.querySelector('.tools');
  if(tools)tools.remove();
  const t=document.createElement('div');t.className='tools';
  const cp=document.createElement('button');cp.textContent='⧉ 复制';
  cp.onclick=()=>{navigator.clipboard.writeText(acc).then(()=>toast('已复制'),()=>toast('复制失败'));};
  const rg=document.createElement('button');rg.className='act-regen';rg.textContent='🔄 重新生成';
  rg.onclick=regenLast;
  const qt=document.createElement('button');qt.textContent='❝ 引用';
  qt.onclick=()=>quoteText(acc);
  const meta=document.createElement('span');meta.className='meta';
  const mb=document.createElement('span');mb.className='mbadge';mb.textContent=curModel;meta.appendChild(mb);
  if(secs){const st=document.createElement('span');st.textContent='⏱ '+secs+'s · '+acc.length+' 字';meta.appendChild(st);}
  t.append(cp,rg,qt,meta);
  body.appendChild(t);
}
function regenLast(){
  if(busy)return;
  const wrap=$('msgWrap');
  const as=wrap.querySelectorAll('.msg.assistant');
  if(!as.length)return;
  as[as.length-1].closest('.msg').remove();
  while(curMsgs.length&&curMsgs[curMsgs.length-1].role==='assistant')curMsgs.pop();
  if(!curMsgs.length||curMsgs[curMsgs.length-1].role!=='user'){toast('没有可重新生成的用户消息');loadConvs();return;}
  streamChat({regenerate:true});
}
function retryLast(){
  if(busy)return;
  // remove failed assistant bubble, re-request with unchanged history
  const wrap=$('msgWrap');
  const as=wrap.querySelectorAll('.msg.assistant');
  if(as.length){as[as.length-1].closest('.msg').remove();
    while(curMsgs.length&&curMsgs[curMsgs.length-1].role==='assistant')curMsgs.pop();}
  if(curMsgs.length&&curMsgs[curMsgs.length-1].role==='user'){streamChat({regenerate:true});}
  else streamChat({});
}

async function genImage(prompt){
  busy=true;setBusyUI(true);
  renderMsg({role:'user',content:'🎨 '+prompt},false);
  curMsgs.push({role:'user',content:'🎨 '+prompt});
  const body=renderMsg({role:'assistant',content:''},true);
  jumpBottom(true);
  try{
    const d=await api('/api/chatui/images',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:curConv,prompt})});
    curConv=d.conversationId;
    body.innerHTML='';const img=document.createElement('img');img.className='att';img.src=d.url;img.onload=scrollBottom;img.onclick=()=>zoom(d.url);body.appendChild(img);
    const tools=document.createElement('div');tools.className='tools';
    const op=document.createElement('button');op.textContent='⬇ 下载原图';
    op.onclick=()=>{const a=document.createElement('a');a.href=d.url;a.download='image.png';a.click();};
    const meta=document.createElement('span');meta.className='meta';
    const mb=document.createElement('span');mb.className='mbadge';mb.textContent='gpt-image-2';meta.appendChild(mb);
    tools.append(op,meta);
    body.appendChild(tools);
    curMsgs.push({role:'assistant',content:'',gen:[d.url.split('/').pop()]});
    loadConvs();
  }catch(e){body.innerHTML='<span style="color:var(--err)">⚠ '+esc(e.message)+'</span>';curMsgs.pop();}
  finally{busy=false;setBusyUI(false);refreshQuota();refreshActions();scrollBottom();}
}
boot();
